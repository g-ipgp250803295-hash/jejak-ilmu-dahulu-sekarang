<!doctype html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jejak Ilmu — Dahulu vs Sekarang</title><style>
:root{--navy:#24344D;--navy2:#17253a;--cream:#F3EBDD;--burg:#884F59;--gold:#A58A62;--line:#d5bea0}*{box-sizing:border-box}body{margin:0;background:var(--navy2);color:var(--cream);font-family:Georgia,'Times New Roman',serif}.museum{max-width:1320px;margin:auto;min-height:370px;background:radial-gradient(ellipse at 85% 10%,#334967 0%,transparent 50%),linear-gradient(125deg,#1a293f,#24344D);padding:18px 22px 20px;position:relative;overflow:hidden}.museum:before{content:'';position:absolute;inset:9px;border:1px solid #a58a6266;pointer-events:none}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;border-bottom:1px solid #a58a6266;padding:0 4px 11px}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:3px;color:#d9bd91;margin-bottom:4px}.header h1{font-size:clamp(22px,3vw,33px);letter-spacing:1px;margin:0}.header p{margin:5px 0 0;font:12px Arial,sans-serif;color:#e7d8c5}.sound{background:#f3ebdd14;border:1px solid #bda17c;color:var(--cream);padding:9px 12px;border-radius:6px;cursor:pointer;font:700 12px Arial,sans-serif;white-space:nowrap}.content{display:grid;grid-template-columns:220px 1fr;gap:16px}.tabs{display:grid;grid-template-columns:1fr;gap:8px}.tab{display:flex;align-items:center;gap:10px;min-height:59px;text-align:left;padding:10px 12px;background:#f3ebdd0e;color:var(--cream);border:1px solid #a58a6270;border-radius:8px;cursor:pointer;font:700 13px Arial,sans-serif;transition:.2s}.tab:hover,.tab:focus-visible{border-color:#f3ebdd;transform:translateX(2px)}.tab.active{background:var(--burg);border-color:#d6b79a;box-shadow:inset 3px 0 #f3ebdd}.tab .emoji{font-size:24px}.panel{border:1px solid #a58a6280;border-radius:10px;padding:14px;background:#f3ebdd0b;min-width:0}.panel-title{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:#f7ead8;font-size:19px}.panel-title:after{content:'';height:1px;flex:1;background:#a58a6280}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.era{background:var(--cream);color:var(--navy);border-radius:8px;overflow:hidden;min-height:211px}.era h3{margin:0;padding:9px 14px;color:white;font:700 14px Arial,sans-serif;letter-spacing:2px}.era.past h3{background:var(--burg)}.era.now h3{background:#3d5677}.era ul{margin:0;padding:12px 16px 12px 31px;font:13px/1.48 Arial,sans-serif}.era li{margin-bottom:7px}.era li::marker{color:var(--burg)}.era.now li::marker{color:#3d5677}.footer{font:10px Arial,sans-serif;letter-spacing:1.4px;color:#c7ae8e;text-align:right;margin-top:9px}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:680px){.museum{padding:16px}.header{align-items:flex-start}.content{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.tab{min-height:54px;font-size:11px;padding:8px}.tab .emoji{font-size:19px}.comparison{grid-template-columns:1fr}.era{min-height:0}.panel-title{font-size:17px}.sound{font-size:11px}}
</style></head><body><main class="museum"><header class="header"><div><div class="eyebrow">JEJAK ILMU · GALERI PERUBAHAN PENDIDIKAN</div><h1>DAHULU <span style="color:#d8b78e">VS</span> SEKARANG</h1><p>Pilih kategori untuk meneroka perubahan pendidikan di Malaysia.</p></div><button class="sound" id="sound" aria-pressed="true">♫ Bunyi: ON</button></header><section class="content"><nav class="tabs" aria-label="Kategori perbandingan"><button class="tab active" data-i="0"><span class="emoji">📖</span><span>BAHASA<br>PENGANTAR</span></button><button class="tab" data-i="1"><span class="emoji">🏫</span><span>SISTEM<br>PERSEKOLAHAN</span></button><button class="tab" data-i="2"><span class="emoji">🎓</span><span>PELUANG<br>PENDIDIKAN</span></button><button class="tab" data-i="3"><span class="emoji">🎯</span><span>MATLAMAT<br>PENDIDIKAN</span></button></nav><article class="panel" id="panel" aria-live="polite"><h2 class="panel-title" id="heading">📖 Bahasa Pengantar</h2><div class="comparison"><div class="era past"><h3>✦ DAHULU</h3><ul id="past"></ul></div><div class="era now"><h3>✦ SEKARANG</h3><ul id="now"></ul></div></div></article></section><div class="footer">WARISAN PENDIDIKAN MALAYSIA · JEJAK ILMU</div></main><script>
const data=[{title:'📖 Bahasa Pengantar',past:['Sekolah Melayu menggunakan bahasa Melayu sebagai bahasa pengantar.','Sekolah Inggeris menggunakan bahasa Inggeris.','Sekolah vernakular Cina dan Tamil menggunakan bahasa ibunda masing-masing.'],now:['Bahasa Melayu menjadi bahasa pengantar utama dalam sistem pendidikan kebangsaan.','Bahasa Inggeris dipelajari sebagai mata pelajaran penting.','Sekolah jenis kebangsaan turut menggunakan bahasa Cina atau Tamil sebagai bahasa pengantar.']},{title:'🏫 Sistem Persekolahan',past:['Wujud aliran sekolah berasingan mengikut bahasa dan komuniti.','Kurikulum serta pengurusan sekolah tidak seragam.','Akses kepada sekolah berbeza mengikut kawasan dan latar masyarakat.'],now:['Sistem pendidikan kebangsaan berpandukan dasar dan kurikulum yang ditetapkan.','Sekolah rendah dan menengah mempunyai struktur persekolahan yang lebih tersusun.','Pentaksiran dan pelaksanaan kurikulum diselaraskan pada peringkat kebangsaan.']},{title:'🎓 Peluang Pendidikan',past:['Peluang belajar tidak sama rata antara bandar dengan luar bandar.','Kemudahan dan pilihan sekolah berbeza mengikut lokasi.','Sebahagian kanak-kanak menghadapi halangan untuk meneruskan pelajaran.'],now:['Akses pendidikan asas diperluas kepada masyarakat pelbagai latar.','Lebih banyak sekolah dan kemudahan pendidikan disediakan.','Laluan pembelajaran termasuk pendidikan akademik, teknikal dan vokasional.']},{title:'🎯 Matlamat Pendidikan',past:['Matlamat sekolah berbeza mengikut aliran dan pentadbiran.','Sebahagian sekolah menumpukan kemahiran asas membaca, menulis dan mengira.','Sistem yang terpisah kurang menggalakkan perpaduan antara komuniti.'],now:['Pendidikan menekankan perkembangan insan secara menyeluruh dan seimbang.','Perpaduan, nilai murni dan identiti kebangsaan menjadi tumpuan.','Ilmu, kemahiran dan pemikiran kritis diperkukuh untuk menghadapi masa depan.']}];
let audioOn=true,ctx;function chime(){if(!audioOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();[660,880].forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.075;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.23)})}catch(e){}}function show(i){const d=data[i],p=document.getElementById('panel');p.classList.remove('fade');void p.offsetWidth;p.classList.add('fade');document.getElementById('heading').textContent=d.title;for(const [id,items] of [['past',d.past],['now',d.now]]){const ul=document.getElementById(id);ul.replaceChildren(...items.map(s=>{let li=document.createElement('li');li.textContent=s;return li}))}document.querySelectorAll('.tab').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))})}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{show(+b.dataset.i);chime()}));document.getElementById('sound').addEventListener('click',e=>{audioOn=!audioOn;e.currentTarget.textContent=audioOn?'♫ Bunyi: ON':'♫ Bunyi: OFF';e.currentTarget.setAttribute('aria-pressed',String(audioOn));if(audioOn)chime()});show(0);
</script></body></html>
